# Legacy domain retirement — mentradev.sbs → mentradev.com (301, permanent).
#
# Mentra moved from mentradev.sbs to mentradev.com. Links already shared before the move
# (session /watch/<id> URLs, unfurled cards, bookmarks) still point at .sbs, so this vhost
# keeps them alive by redirecting every one of them to the same path on .com.
#
# Deliberately NOT `return 301 https://$host$request_uri` — $host is still the .sbs
# hostname, which would redirect the visitor straight back to itself in an infinite loop.
# Each block names its .com target literally, so app.* → app.* and the apex → the apex,
# with $request_uri preserving the path and query string.
#
# This file defines NO `map` — nginx/mentra.vps.conf already declares
# $mentra_is_social_crawler at http context, and a second definition of the same name is a
# duplicate-map error that stops nginx from starting. Never install this by copying
# mentra.vps.conf.
#
# Requirements while this is enabled:
#   - mentradev.sbs DNS (app, apex, www) must still resolve to this VPS.
#   - The .sbs registration must stay active.
#   - The .sbs certs must NOT be deleted — https:// links fail at the TLS handshake,
#     before the 301 is ever sent. Keep them renewing until you retire this file.
#
# Install:
#   sudo certbot certificates    # confirm the .sbs cert names + paths below are right
#   sudo cp nginx/sbs-redirect.vps.conf /etc/nginx/sites-available/mentra-sbs-redirect.conf
#   sudo ln -s /etc/nginx/sites-available/mentra-sbs-redirect.conf \
#              /etc/nginx/sites-enabled/mentra-sbs-redirect.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Retire (once traffic to .sbs has dried up — check the access logs):
#   sudo rm /etc/nginx/sites-enabled/mentra-sbs-redirect.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot delete --cert-name app.mentradev.sbs
#   sudo certbot delete --cert-name mentradev.sbs

# ---- App subdomain: app.mentradev.sbs → app.mentradev.com ----

server {
  listen 80;
  listen [::]:80;
  server_name app.mentradev.sbs;

  # ACME http-01 must be served, not redirected, or cert renewal fails while this vhost
  # is enabled — and an expired .sbs cert breaks every https:// redirect below.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://app.mentradev.com$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name app.mentradev.sbs;

  ssl_certificate     /etc/letsencrypt/live/app.mentradev.sbs/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.mentradev.sbs/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://app.mentradev.com$request_uri;
}

# ---- Landing root + www: mentradev.sbs → mentradev.com ----

server {
  listen 80;
  listen [::]:80;
  server_name mentradev.sbs www.mentradev.sbs;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://mentradev.com$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name mentradev.sbs www.mentradev.sbs;

  ssl_certificate     /etc/letsencrypt/live/mentradev.sbs/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mentradev.sbs/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://mentradev.com$request_uri;
}
