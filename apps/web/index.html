<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover extends the app into the notch / home-indicator safe areas
         (handled with env(safe-area-inset-*) in CSS). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Installable PWA (Android "Install" + iOS "Add to Home Screen") -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Mentra" />
    <!-- Android/Chrome standalone -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS standalone: run full-screen with a light status bar (dark text on light) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mentra" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/mentra-apple-touch-180.png" />

    <!-- Primary SEO -->
    <title>Mentra — Get Your First Software Developer Job</title>
    <meta
      name="description"
      content="Sign in to Mentra — your step-by-step plan to crack Software Developer interviews: daily practice, mock HR &amp; technical rounds, live mentors, and resume review."
    />
    <meta name="author" content="Mentra" />
    <link rel="canonical" href="https://app.mentradev.com/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, Slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mentra" />
    <meta property="og:title" content="Mentra — Get Your First Software Developer Job" />
    <meta
      property="og:description"
      content="Structured mentorship for CS graduates: an interview-prep plan, mock HR &amp; technical rounds, live mentors, and resume review — in one place."
    />
    <meta property="og:url" content="https://app.mentradev.com/" />
    <meta property="og:image" content="https://app.mentradev.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mentra — structured mentorship that takes Computer Science graduates to their first Software Developer job." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mentra — Get Your First Software Developer Job" />
    <meta
      name="twitter:description"
      content="Structured mentorship for CS graduates: an interview-prep plan, mock HR &amp; technical rounds, live mentors, and resume review — in one place."
    />
    <meta name="twitter:image" content="https://app.mentradev.com/og-image.png" />
    <meta name="twitter:image:alt" content="Mentra — structured mentorship that takes Computer Science graduates to their first Software Developer job." />

    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
